version: 0.17-0

tls:
  enabled: false

mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  coral:
    type: edgetpu
    device: usb
  coral2:
    type: edgetpu
    device: usb:1

detect:
  enabled: true
  width: 1920
  height: 1080
  fps: 10

audio:
  listen:
    - bark
    - fire_alarm
    - speech
    - yell

record:
  sync_recordings: false
  enabled: true
  continuous:
    days: 0
  motion:
    days: 3
  alerts:
    retain:
      days: 14
      mode: all
  detections:
    retain:
      days: 14
      mode: all

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: true
  retain:
    default: 14

ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

model:
  path: plus://a3fd6716d9d979af9bac56ef19195556

birdseye:
  enabled: false
  mode: continuous
  width: 1920
  height: 1080
  layout:
    max_cameras: 4

objects:
  track:
    - face
    - person
  filters:
    face:
      min_score: 0.8
      threshold: 0.85

semantic_search:
  enabled: false
  model_size: small

face_recognition:
  enabled: true
  model_size: large
  min_area: 400

lpr:
  enabled: true
  model_size: small
  debug_save_plates: true
  enhancement: 6
  recognition_threshold: 0.80
  min_area: 1000
  match_distance: 1
  format: ^[a-zA-Z\s0-9\-]{2,8}$

classification:
  bird:
    enabled: false
  custom:
    Workshop Garage Door:
      enabled: true
      name: Workshop Garage Door
      threshold: 0.8
      state_config:
        cameras:
          workshop-yard:
            crop:
              - 0.8803258157373774
              - 0.06788707316181289
              - 0.9619496486395249
              - 0.21299610943229735
        motion: true
    Gio’s Tesla:
      enabled: true
      name: Gio’s Tesla
      threshold: 0.8
      object_config:
        objects:
          - car
        classification_type: sub_label

camera_groups: {}

go2rtc:
#  rtsp:
#    username: '{FRIGATE_RTSP_USER}'
#    password: '{FRIGATE_RTSP_PASSWORD}'
  streams:
    workshop-yard:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-exterior.workshop.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:33931/6413503b246a4c8a
    drive:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-drive.workshop.{FRIGATE_CAM_DOMAIN}:554/h264Preview_01_main
      - rtsp://host.docker.internal:45941/538b8004d5d3a250
    entrance:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam.entrance.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:35953/b545d5b512999cd0
    garage-yard:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-exterior.garage.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:39481/bb6bc04b1f5f823c
    garden:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam.garden.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:34593/edf8fc8483d412f2
  webrtc:
    candidates:
      - 192.168.1.86:8555
      - 192.168.1.84:8555
      - cam.coia.io:8555
      - stun:8555

cameras:
  entrance:
    lpr:
      enabled: false
    record:
      alerts:
        retain:
          mode: motion
      detections:
        retain:
          mode: motion
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/entrance
          roles:
            - record
            - detect
            - audio
    audio:
      enabled: true
    objects:
      track:
        - face
        - person
        - package
        - dog
        - cat
        - bicycle
        - car
        - bear
        - deer
      filters:
        car: {}
