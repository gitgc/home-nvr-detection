review:
  genai:
    enabled: true
    detections: true
    activity_context_prompt: "### Normal Activity Indicators (Level 0)\n- Known/verified
      people in any zone at any time\n- Routine residential vehicle access during
      daytime/evening (6 AM - 10 PM): entering, exiting, loading/unloading items —
      normal commute and travel patterns\n- Deliveries or services during daytime/evening
      (6 AM - 10 PM): carrying packages to doors/porches, placing items, leaving\n\
      - Services/maintenance workers with visible tools, uniforms, or service vehicles
      during daytime\n- Activity confined to public areas only (sidewalks, streets)
      without entering property at any time\n\n### Suspicious Activity Indicators
      (Level 1)\n- **Checking or probing vehicle/building access**: trying handles
      without entering, peering through windows, examining multiple vehicles, or possessing
      break-in tools — Level 1\n- **Unidentified person in private areas (driveways,
      near vehicles/buildings) during late night/early morning (11 PM - 5 AM)** —
      ALWAYS Level 1 regardless of activity or duration\n- Taking items that don't
      belong to them (packages, objects from porches/driveways)\n- Climbing or jumping
      fences/barriers to access property\n- Attempting to conceal actions or items
      from view\n- Prolonged loitering: remaining in same area without visible purpose
      throughout most of the sequence\n\n### Critical Threat Indicators (Level 2)\n\
      - Holding break-in tools (crowbars, pry bars, bolt cutters)\n- Weapons visible
      (guns, knives, bats used aggressively)\n- Forced entry in progress\n- Physical
      aggression or violence\n- Active property damage or theft in progress\n\n###
      Assessment Guidance\nEvaluate in this order:\n\n1. **If person is verified/known**
      → Level 0 regardless of time or activity\n2. **If person is unidentified:**\n\
      \   - Check time: If late night/early morning (11 PM - 5 AM) AND in private
      areas (driveways, near vehicles/buildings) → Level 1\n   - Check actions: If
      probing access (trying handles without entering, checking multiple vehicles),
      taking items, climbing → Level 1\n   - Otherwise, if daytime/evening (6 AM -
      10 PM) with clear legitimate purpose (delivery, service, routine vehicle access)
      → Level 0\n3. **Escalate to Level 2 if:** Weapons, break-in tools, forced entry
      in progress, violence, or active property damage visible (escalates from Level
      0 or 1)\n\nThe mere presence of an unidentified person in private areas during
      late night hours is inherently suspicious and warrants human review, regardless
      of what activity they appear to be doing or how brief the sequence is."
genai:
  newKey:
    api_key: "{FRIGATE_GENAI_API_KEY}"
    provider: gemini
    roles:
      - descriptions
      - chat
    model: models/gemini-2.5-flash
