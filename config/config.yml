version: 0.17-0

tls:
  enabled: false

mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  coral:
    type: edgetpu
    device: usb
  coral2:
    type: edgetpu
    device: usb:1

detect:
  enabled: true
  width: 1920
  height: 1080
  fps: 10

record:
  sync_recordings: false
  enabled: true
  continuous:
    days: 0
  motion:
    days: 3
  alerts:
    retain:
      days: 14
      mode: all
  detections:
    retain:
      days: 14
      mode: all

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: true
  retain:
    default: 14

ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

model:
  path: plus://be9c11b486ba0e2b8ea13338d4cc66ee

birdseye:
  enabled: false
  mode: continuous
  width: 1920
  height: 1080
  layout:
    max_cameras: 4

objects:
  track:
    - face
    - person
  filters:
    face:
      min_score: 0.5
      threshold: 0.6

semantic_search:
  enabled: false
  model_size: small

face_recognition:
  enabled: true
  model_size: large
  min_area: 400

lpr:
  enabled: true
  model_size: small
  debug_save_plates: false
  enhancement: 1
  recognition_threshold: 0.75
  min_area: 1000

classification:
  bird:
    enabled: false
  custom: {}

camera_groups: {}
go2rtc:
  rtsp:
    username: '{FRIGATE_RTSP_USER}'
    password: '{FRIGATE_RTSP_PASSWORD}'
  streams:
    workshop-yard:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-exterior.workshop.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:33931/6413503b246a4c8a
    workshop-drive:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-drive.workshop.{FRIGATE_CAM_DOMAIN}:554/h264Preview_01_main
      - rtsp://host.docker.internal:45941/538b8004d5d3a250
    entrance:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam.entrance.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:35953/b545d5b512999cd0
    garage-yard:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-exterior.garage.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:39481/bb6bc04b1f5f823c
    garden:
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam.garden.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - rtsp://host.docker.internal:34593/edf8fc8483d412f2
  webrtc:
    candidates:
      - 192.168.1.86:8555
      - stun:8555

cameras:
  entrance:
    record:
      alerts:
        retain:
          mode: motion
      detections:
        retain:
          mode: motion
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/entrance
          roles:
            - record
            - detect
    objects:
      track:
        - face
        - person
        - package
        - dog
        - cat
        - bicycle
        - car
        - bear
        - deer
      filters:
        car: {}
        person:
          mask: 0.474,0.007,0.56,0.006,0.554,0.038,0.475,0.037
    motion:
      threshold: 40
      contour_area: 30
      improve_contrast: true
