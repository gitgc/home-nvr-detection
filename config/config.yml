tls:
  enabled: false

mqtt:
  host: mqtt
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

detect:
  enabled: true

detectors:
  coral:
    type: edgetpu
    device: usb
  coral2:
    type: edgetpu
    device: usb:1

birdseye:
  enabled: true
  mode: continuous
  width: 1920
  height: 1080
  layout:
    max_cameras: 4

cameras:
  workshop-yard:
    enabled: true
    ffmpeg:
      hwaccel_args: &defaultHardwareAccelArgs
        - -hwaccel
        - vaapi
        - -hwaccel_device
        - /dev/dri/renderD128
        - -hwaccel_output_format
        - yuv420p
      inputs:
        - path: 
            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam-exterior.workshop.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
          roles: &defaultExteriorRoles
            - record
            - detect
    detect: &defaultDetectArgs
      width: 1920
      height: 1080
      fps: 10
    objects:
      track:
        - face
        - person
        - car
      filters:
        car: {}
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 14
    snapshots: &defaultSnapshotArgs
      timestamp: true
      bounding_box: true
      crop: true
      enabled: true
    motion:
      threshold: 45
      contour_area: 45
      improve_contrast: true
      mask:
        - 0.086,0.643,0.17,0.618,0.344,0.568,0.474,0.628,0.637,0.774,0.522,1,0.201,1,0.067,1,0.045,0.807
        - 0.214,0.037,0.214,0,0,0,0.002,0.037
    zones:
      yard:
        coordinates: 1920,1080,0,1080,0,0,930,0,1679,0,1624,217,1920,298
