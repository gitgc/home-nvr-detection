            rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@cam.entrance.{FRIGATE_CAM_DOMAIN}:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
          roles: *defaultExteriorRoles
    detect: *defaultDetectArgs
    objects:
      track:
        - face
        - person
        - package
      filters:
        car: {}
        person:
          mask: 0.474,0.007,0.56,0.006,0.554,0.038,0.475,0.037
    record:
      enabled: true
      continuous:
        days: 0
      motion:
        days: 14
    snapshots: *defaultSnapshotArgs
    motion:
      threshold: 40
      contour_area: 30
      improve_contrast: true

      mask: 0.812,0.041,0.964,0.038,0.964,0.075,0.812,0.078
    zones:
