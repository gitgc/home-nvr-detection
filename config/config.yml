version: 0.18-0

auth:
  session_length: 14515200

tls:
  enabled: false

mqtt:
  enabled: true
  host: mqtt
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

detectors:
  coral:
    type: edgetpu
    device: usb
  coral2:
    type: edgetpu
    device: usb:1

detect:
  enabled: true
  width: 1920
  height: 1080
  fps: 10

audio:
  listen:
    - bark
    - fire_alarm
    - speech
    - yell

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 3
  alerts:
    retain:
      days: 14
      mode: all
  detections:
    retain:
      days: 14
      mode: all

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  crop: true
  retain:
    default: 14

ffmpeg:
  hwaccel_args: preset-intel-qsv-h264

model:
  path: ${PLUS_MODEL_PATH}

birdseye:
  enabled: false
  mode: continuous
  width: 1920
  height: 1080
  layout:
    max_cameras: 4

objects:
  track:
    - face
    - person
  filters:
    face:
      min_score: 0.8
      threshold: 0.85

  genai:
    enabled: true
    use_snapshot: true
    objects:
      - bear
      - amazon
      - car
      - cat
      - deer
      - dog
      - face
      - license_plate
      - package
      - person
      - ups
      - usps
face_recognition:
  enabled: true
  model_size: large
  min_area: 400

lpr:
  enabled: true
  model_size: small
  debug_save_plates: true
  enhancement: 6
  recognition_threshold: 0.80
  min_area: 1000
  match_distance: 1
  format: ^[a-zA-Z\s0-9\-]{2,8}$

classification:
  bird:
    enabled: false
  custom:
    Workshop Garage Door:
      enabled: true
      name: Workshop Garage Door
      threshold: 0.8
      state_config:
        cameras:
          workshop-yard:
            crop:
              - 0.8803258157373774
              - 0.06788707316181289
              - 0.9619496486395249
              - 0.21299610943229735
        motion: true
    Gio’s Tesla:
      enabled: true
      name: Gio’s Tesla
      threshold: 0.8
      object_config:
        objects:
          - car
        classification_type: sub_label

    chicken:
      enabled: true
      name: chicken
      threshold: 0.8
      object_config:
        objects:
          - bird
        classification_type: sub_label
